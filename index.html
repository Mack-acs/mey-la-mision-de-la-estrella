<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#f8eee9">
    <title>Mey — La misión de la estrella</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- =====================================================
         BIBLIOTECA DE ILUSTRACIONES (SVG)
         Se dibujan una vez y se usan con <svg><use href="#nombre"></use></svg>
    ====================================================== -->
    <svg width="0" height="0" style="position:absolute" aria-hidden="true">

        <defs>
            <linearGradient id="gGold" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" stop-color="#fff3c4" />
                <stop offset="1" stop-color="#e2b85a" />
            </linearGradient>

            <radialGradient id="gPink" cx="0.5" cy="0.35" r="0.75">
                <stop offset="0" stop-color="#ffe6ec" />
                <stop offset="1" stop-color="#e9a2b8" />
            </radialGradient>

            <radialGradient id="gShadow" cx="0.5" cy="0.35" r="0.8">
                <stop offset="0" stop-color="#7b6490" />
                <stop offset="1" stop-color="#2b2233" />
            </radialGradient>

            <mask id="mMoon">
                <rect width="100" height="100" fill="#fff" />
                <circle cx="72" cy="36" r="33" fill="#000" />
            </mask>
        </defs>

        <!-- ESTRELLA -->
        <symbol id="star" viewBox="0 0 100 100">
            <path d="M50,10 L60.6,37.4 L89.9,39 L67.1,57.6 L74.7,86 L50,70 L25.3,86 L32.9,57.6 L10.1,39 L39.4,37.4 Z"
                fill="url(#gGold)" stroke="#e2b85a" stroke-width="6" stroke-linejoin="round" />
            <ellipse cx="44" cy="40" rx="6" ry="3.5" fill="#ffffff" opacity="0.7" transform="rotate(-25 44 40)" />
        </symbol>

        <!-- LUNA -->
        <symbol id="moon" viewBox="0 0 100 100">
            <circle cx="46" cy="52" r="40" fill="url(#gGold)" mask="url(#mMoon)" />
        </symbol>

        <!-- HOJA DE OTOÑO (usa "color" de CSS) -->
        <symbol id="leaf" viewBox="0 0 30 30">
            <path d="M15,2 C27,9 27,22 15,28 C3,22 3,9 15,2 Z" fill="currentColor" />
            <path d="M15,6 L15,27" stroke="rgba(255,255,255,0.4)" stroke-width="1" fill="none" />
        </symbol>

        <!-- PEONÍA -->
        <symbol id="peony" viewBox="0 0 100 100">
            <path d="M50,54 C28,60 14,78 16,92 C34,90 48,78 50,54 Z" fill="#a9b98a" stroke="#869a68" stroke-width="1.5" />
            <path d="M50,54 C72,60 86,78 84,92 C66,90 52,78 50,54 Z" fill="#a9b98a" stroke="#869a68" stroke-width="1.5" />
            <g fill="url(#gPink)" stroke="#d98aa3" stroke-width="1.5">
                <ellipse cx="50" cy="27" rx="14" ry="21" />
                <ellipse cx="50" cy="27" rx="14" ry="21" transform="rotate(45 50 50)" />
                <ellipse cx="50" cy="27" rx="14" ry="21" transform="rotate(90 50 50)" />
                <ellipse cx="50" cy="27" rx="14" ry="21" transform="rotate(135 50 50)" />
                <ellipse cx="50" cy="27" rx="14" ry="21" transform="rotate(180 50 50)" />
                <ellipse cx="50" cy="27" rx="14" ry="21" transform="rotate(225 50 50)" />
                <ellipse cx="50" cy="27" rx="14" ry="21" transform="rotate(270 50 50)" />
                <ellipse cx="50" cy="27" rx="14" ry="21" transform="rotate(315 50 50)" />
            </g>
            <g fill="#fdd5e0" stroke="#d98aa3" stroke-width="1.2">
                <ellipse cx="50" cy="35" rx="11" ry="15" transform="rotate(30 50 50)" />
                <ellipse cx="50" cy="35" rx="11" ry="15" transform="rotate(90 50 50)" />
                <ellipse cx="50" cy="35" rx="11" ry="15" transform="rotate(150 50 50)" />
                <ellipse cx="50" cy="35" rx="11" ry="15" transform="rotate(210 50 50)" />
                <ellipse cx="50" cy="35" rx="11" ry="15" transform="rotate(270 50 50)" />
                <ellipse cx="50" cy="35" rx="11" ry="15" transform="rotate(330 50 50)" />
            </g>
            <circle cx="50" cy="50" r="8" fill="#f0cf7a" stroke="#c9a45c" stroke-width="1.5" />
            <circle cx="47" cy="48" r="1.5" fill="#fff3c4" />
            <circle cx="53" cy="52" r="1.5" fill="#fff3c4" />
        </symbol>

        <!-- TULIPÁN -->
        <symbol id="tulip" viewBox="0 0 100 100">
            <path d="M50,96 C38,80 30,66 34,50 C46,62 52,80 50,96 Z" fill="#a9b98a" stroke="#869a68" stroke-width="1.5" />
            <path d="M50,96 C62,80 70,66 66,50 C54,62 48,80 50,96 Z" fill="#a9b98a" stroke="#869a68" stroke-width="1.5" />
            <rect x="48" y="52" width="4" height="44" rx="2" fill="#869a68" />
            <path d="M30,16 C28,40 36,56 50,60 C48,44 44,28 30,16 Z" fill="#e9a2b8" stroke="#d98aa3" stroke-width="1.5" stroke-linejoin="round" />
            <path d="M70,16 C72,40 64,56 50,60 C52,44 56,28 70,16 Z" fill="#e9a2b8" stroke="#d98aa3" stroke-width="1.5" stroke-linejoin="round" />
            <path d="M50,8 C40,24 36,46 50,60 C64,46 60,24 50,8 Z" fill="url(#gPink)" stroke="#d98aa3" stroke-width="1.5" stroke-linejoin="round" />
        </symbol>

        <!-- NENÚFAR -->
        <symbol id="waterlily" viewBox="0 0 100 100">
            <ellipse cx="50" cy="78" rx="42" ry="16" fill="#b9c79a" stroke="#8fa270" stroke-width="2" />
            <path d="M50,78 L20,72 M50,78 L80,72 M50,78 L50,93" stroke="#8fa270" stroke-width="1" fill="none" opacity="0.6" />
            <g fill="#fdeef3" stroke="#e5a9bd" stroke-width="1.5" stroke-linejoin="round">
                <path d="M50,74 C37,58 38,38 50,24 C62,38 63,58 50,74 Z" transform="rotate(-62 50 74)" />
                <path d="M50,74 C37,58 38,38 50,24 C62,38 63,58 50,74 Z" transform="rotate(62 50 74)" />
                <path d="M50,74 C37,58 38,38 50,24 C62,38 63,58 50,74 Z" transform="rotate(-32 50 74)" />
                <path d="M50,74 C37,58 38,38 50,24 C62,38 63,58 50,74 Z" transform="rotate(32 50 74)" />
                <path d="M50,74 C37,58 38,38 50,24 C62,38 63,58 50,74 Z" />
            </g>
            <circle cx="50" cy="66" r="5" fill="#f0cf7a" stroke="#c9a45c" stroke-width="1.2" />
        </symbol>

        <!-- SOMBRA -->
        <symbol id="shadow" viewBox="0 0 100 100">
            <path d="M50,12 C74,12 88,32 86,56 C85,72 92,84 82,90 C74,94 70,84 62,90 C54,96 46,88 38,90 C30,94 24,86 16,88 C8,84 14,72 14,56 C12,32 26,12 50,12 Z"
                fill="url(#gShadow)" stroke="#8f77a3" stroke-width="2.5" stroke-linejoin="round" />
            <path d="M24,22 L20,6 L38,16 Z M76,22 L80,6 L62,16 Z" fill="#4a3a5a" stroke="#8f77a3" stroke-width="2" stroke-linejoin="round" />
            <ellipse cx="36" cy="48" rx="8" ry="10" fill="#efe3ff" />
            <ellipse cx="64" cy="48" rx="8" ry="10" fill="#efe3ff" />
            <ellipse cx="37" cy="50" rx="4" ry="5.5" fill="#3a2d48" />
            <ellipse cx="63" cy="50" rx="4" ry="5.5" fill="#3a2d48" />
            <circle cx="38.5" cy="47" r="1.6" fill="#fff" />
            <circle cx="64.5" cy="47" r="1.6" fill="#fff" />
            <circle cx="26" cy="64" r="4" fill="#d98fb5" opacity="0.5" />
            <circle cx="74" cy="64" r="4" fill="#d98fb5" opacity="0.5" />
            <path d="M44,66 Q50,71 56,66" fill="none" stroke="#b9a2cf" stroke-width="2" stroke-linecap="round" />
        </symbol>

        <!-- CAMPANA DE CRISTAL (usa "color" de CSS) -->
        <symbol id="bell" viewBox="0 0 60 80">
            <circle cx="30" cy="6" r="4" fill="none" stroke="#c9a45c" stroke-width="2.5" />
            <path d="M30,9 C16,9 12,26 12,42 C12,54 6,60 6,64 L54,64 C54,60 48,54 48,42 C48,26 44,9 30,9 Z"
                fill="currentColor" stroke="rgba(120,80,100,0.55)" stroke-width="2" stroke-linejoin="round" />
            <ellipse cx="22" cy="30" rx="4" ry="11" fill="#fff" opacity="0.5" transform="rotate(10 22 30)" />
            <circle cx="30" cy="70" r="6" fill="#e2b85a" stroke="#c9a45c" stroke-width="1.5" />
        </symbol>

        <!-- LLAVE -->
        <symbol id="key" viewBox="0 0 100 100">
            <circle cx="26" cy="50" r="16" fill="none" stroke="url(#gGold)" stroke-width="9" />
            <rect x="40" y="46" width="52" height="9" rx="3" fill="url(#gGold)" stroke="#c9a45c" stroke-width="2" />
            <rect x="72" y="54" width="8" height="16" rx="2" fill="url(#gGold)" stroke="#c9a45c" stroke-width="2" />
            <rect x="85" y="54" width="7" height="11" rx="2" fill="url(#gGold)" stroke="#c9a45c" stroke-width="2" />
        </symbol>

        <!-- LIBRO (usa "color" de CSS) -->
        <symbol id="book" viewBox="0 0 60 50">
            <rect x="4" y="6" width="52" height="38" rx="4" fill="currentColor" stroke="rgba(90,50,60,0.55)" stroke-width="2" />
            <rect x="4" y="6" width="10" height="38" rx="3" fill="rgba(0,0,0,0.14)" />
            <rect x="20" y="14" width="28" height="3" rx="1.5" fill="#f3dfa0" />
            <rect x="24" y="20" width="20" height="3" rx="1.5" fill="#f3dfa0" />
            <rect x="12" y="41" width="42" height="3" fill="#fff4e4" />
        </symbol>

        <!-- MEY DE FRENTE -->
        <symbol id="mey" viewBox="0 0 60 90">
            <path d="M11,34 C6,6 54,6 49,34 C52,52 56,64 47,74 C40,67 20,67 13,74 C4,64 8,52 11,34 Z"
                fill="#e9c77a" stroke="#c49a4a" stroke-width="1.5" stroke-linejoin="round" />
            <rect x="23" y="80" width="5" height="7" rx="2" fill="#f8d9c4" />
            <rect x="32" y="80" width="5" height="7" rx="2" fill="#f8d9c4" />
            <ellipse cx="25.5" cy="87.5" rx="4.5" ry="2.5" fill="#b9758a" />
            <ellipse cx="34.5" cy="87.5" rx="4.5" ry="2.5" fill="#b9758a" />
            <path d="M20,52 L40,52 L49,82 L11,82 Z" fill="#e8a9bd" stroke="#b9758a" stroke-width="1.5" stroke-linejoin="round" />
            <path d="M11,82 Q17,87 23,82 Q29,87 35,82 Q41,87 49,82" fill="none" stroke="#fff4e4" stroke-width="2.2" stroke-linecap="round" />
            <rect x="20" y="52" width="20" height="5" rx="2" fill="#f3dfa0" stroke="#c9a45c" stroke-width="1" />
            <path d="M30,64 C36,66 37,73 30,77 C23,73 24,66 30,64 Z" fill="#d9894a" opacity="0.85" />
            <ellipse cx="17" cy="62" rx="3.2" ry="7" fill="#f8d9c4" stroke="#c9967f" stroke-width="1" transform="rotate(12 17 62)" />
            <ellipse cx="43" cy="62" rx="3.2" ry="7" fill="#f8d9c4" stroke="#c9967f" stroke-width="1" transform="rotate(-12 43 62)" />
            <circle cx="30" cy="34" r="16" fill="#f8d9c4" stroke="#c9967f" stroke-width="1.5" />
            <path d="M13,33 C13,12 47,12 47,33 C42,25 36,22 30,25 C24,22 18,25 13,33 Z"
                fill="#efd088" stroke="#c49a4a" stroke-width="1.2" stroke-linejoin="round" />
            <ellipse cx="23.5" cy="36" rx="2.6" ry="3.6" fill="#5a3a45" />
            <ellipse cx="36.5" cy="36" rx="2.6" ry="3.6" fill="#5a3a45" />
            <circle cx="24.3" cy="34.6" r="1" fill="#fff" />
            <circle cx="37.3" cy="34.6" r="1" fill="#fff" />
            <circle cx="19" cy="42" r="3" fill="#f5a9b8" opacity="0.6" />
            <circle cx="41" cy="42" r="3" fill="#f5a9b8" opacity="0.6" />
            <path d="M27.5,43 Q30,45.5 32.5,43" fill="none" stroke="#a8606f" stroke-width="1.2" stroke-linecap="round" />
            <path d="M41,17 L51,11 L51,23 Z M41,17 L33,11 L33,23 Z" fill="#e8a9bd" stroke="#b9758a" stroke-width="1" stroke-linejoin="round" transform="translate(2 0)" />
            <circle cx="43" cy="17" r="2.6" fill="#f3dfa0" stroke="#c9a45c" stroke-width="1" />
        </symbol>

        <!-- MEY DE ESPALDA (cuando camina hacia arriba) -->
        <symbol id="mey-back" viewBox="0 0 60 90">
            <rect x="23" y="80" width="5" height="7" rx="2" fill="#f8d9c4" />
            <rect x="32" y="80" width="5" height="7" rx="2" fill="#f8d9c4" />
            <ellipse cx="25.5" cy="87.5" rx="4.5" ry="2.5" fill="#b9758a" />
            <ellipse cx="34.5" cy="87.5" rx="4.5" ry="2.5" fill="#b9758a" />
            <path d="M20,52 L40,52 L49,82 L11,82 Z" fill="#e8a9bd" stroke="#b9758a" stroke-width="1.5" stroke-linejoin="round" />
            <path d="M11,82 Q17,87 23,82 Q29,87 35,82 Q41,87 49,82" fill="none" stroke="#fff4e4" stroke-width="2.2" stroke-linecap="round" />
            <rect x="20" y="52" width="20" height="5" rx="2" fill="#f3dfa0" stroke="#c9a45c" stroke-width="1" />
            <ellipse cx="17" cy="62" rx="3.2" ry="7" fill="#f8d9c4" stroke="#c9967f" stroke-width="1" transform="rotate(12 17 62)" />
            <ellipse cx="43" cy="62" rx="3.2" ry="7" fill="#f8d9c4" stroke="#c9967f" stroke-width="1" transform="rotate(-12 43 62)" />
            <path d="M11,34 C6,6 54,6 49,34 C52,52 56,64 47,74 C40,67 20,67 13,74 C4,64 8,52 11,34 Z"
                fill="#e9c77a" stroke="#c49a4a" stroke-width="1.5" stroke-linejoin="round" />
            <path d="M30,14 C28,34 30,54 30,70 M20,22 C18,40 20,58 22,68 M40,22 C42,40 40,58 38,68"
                fill="none" stroke="#c49a4a" stroke-width="1" opacity="0.5" stroke-linecap="round" />
            <path d="M41,17 L51,11 L51,23 Z M41,17 L33,11 L33,23 Z" fill="#e8a9bd" stroke="#b9758a" stroke-width="1" stroke-linejoin="round" transform="translate(2 0)" />
            <circle cx="43" cy="17" r="2.6" fill="#f3dfa0" stroke="#c9a45c" stroke-width="1" />
        </symbol>
    </svg>


    <main id="game">

        <!-- INICIO -->
        <section id="start-screen" class="screen hidden">
            <div class="fx back" id="start-fx"></div>
            <div class="title-container">
                <svg class="title-star"><use href="#star"></use></svg>
                <h1>MEY</h1>
                <h2>La misión de la estrella</h2>
                <p>Una pequeña aventura hecha para ti.</p>
                <button id="start-button" class="btn">COMENZAR</button>
            </div>
        </section>

        <!-- PRÓLOGO -->
        <section id="prologue-screen" class="screen hidden">
            <div class="fx back" id="prologue-fx"></div>
            <div class="prologue-container">
                <p class="prologue-date">9 de octubre</p>
                <p class="prologue-text">Una noche de otoño...</p>
                <p class="prologue-text">mientras todos celebraban un cumpleaños, algo extraño ocurrió.</p>
                <svg class="prologue-star"><use href="#star"></use></svg>
                <p class="prologue-text">La estrella que guiaba aquella noche desapareció.</p>
                <p class="prologue-highlight">La estrella de Mey había desaparecido.</p>
                <button id="continue-button" class="btn">CONTINUAR</button>
            </div>
        </section>

        <!-- (Jardín, cámara de las sombras, bosque, biblioteca y luna
             se crean automáticamente desde js/main.js) -->

        <!-- CARTA FINAL (el texto se edita en CONFIG.letter, dentro de main.js) -->
        <section id="letter-screen" class="screen night hidden">
            <div class="fx back" id="letter-fx"></div>
        </section>

        <!-- FINAL -->
        <section id="final-screen" class="screen night hidden">
            <div class="fx back" id="final-fx"></div>
            <div class="final-sky">
                <svg class="final-moon"><use href="#moon"></use></svg>
                <svg class="final-star"><use href="#star"></use></svg>
            </div>
            <div class="final-text">
                <h1 id="final-line1"></h1>
                <h2 id="final-line2"></h2>
                <button id="replay-button" class="btn">VOLVER A VER LA HISTORIA</button>
            </div>
        </section>

        <!-- ELEMENTOS COMPARTIDOS -->
        <div id="prompt" class="hidden"></div>

        <div id="dialogue" class="hidden">
            <p id="dialogue-title"></p>
            <p id="dialogue-text"></p>
        </div>

        <!-- Tarjeta para libros y carta -->
        <div id="overlay" class="hidden">
            <div id="card"></div>
        </div>

        <!-- Controles táctiles -->
        <div id="touch-controls">
            <div class="dpad">
                <button class="dbtn up" data-dir="up" aria-label="Arriba"><svg viewBox="0 0 24 24"><path d="M12 6 L20 17 H4 Z" /></svg></button>
                <button class="dbtn left" data-dir="left" aria-label="Izquierda"><svg viewBox="0 0 24 24"><path d="M12 6 L20 17 H4 Z" /></svg></button>
                <button class="dbtn right" data-dir="right" aria-label="Derecha"><svg viewBox="0 0 24 24"><path d="M12 6 L20 17 H4 Z" /></svg></button>
                <button class="dbtn down" data-dir="down" aria-label="Abajo"><svg viewBox="0 0 24 24"><path d="M12 6 L20 17 H4 Z" /></svg></button>
            </div>
            <button id="touch-interact">INTERACTUAR</button>
            <button id="touch-attack">ATACAR</button>
        </div>

        <div id="fade" class="on"></div>

    </main>

    <script src="js/main.js"></script>

</body>

</html>
